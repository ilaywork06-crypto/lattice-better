[project]
name = "lattice-notifications"
version = "2.0.0"
description = "Lattice notification service — consumes domain events, stores in-app notifications, sends email"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "aiosmtplib>=3.0",
    "redis>=5.0",
    "lattice-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice_notifications"]
