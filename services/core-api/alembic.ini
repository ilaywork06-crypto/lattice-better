# Usage (from the repo root):
#   uv run alembic -c services/core-api/alembic.ini revision --autogenerate -m "what changed"
#   uv run alembic -c services/core-api/alembic.ini upgrade head
[alembic]
script_location = %(here)s/src/lattice_core/db/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
