<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Lattice</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      try {
        const t = localStorage.getItem('lattice.theme') || 'system'
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        const a = localStorage.getItem('lattice.accent') || 'periwinkle'
        const legacy = { indigo: 'periwinkle', violet: 'lavender', rose: 'blush', amber: 'peach', teal: 'mint' }
        document.documentElement.dataset.accent = legacy[a] || a
        const lng = localStorage.getItem('lattice.lang')
        if (lng === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl' }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
