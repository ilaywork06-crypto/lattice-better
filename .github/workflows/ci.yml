name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: lattice, POSTGRES_PASSWORD: lattice, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lattice" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check services packages scripts
      - name: Tests (SQLite)
        run: uv run pytest services
      - name: Core API tests (PostgreSQL)
        run: uv run pytest services/core-api/tests
        env:
          LATTICE_TEST_POSTGRES_URL: postgresql+psycopg://lattice:lattice@localhost:5432/postgres

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types scripts/check-i18n.mjs
      - run: npm run build
