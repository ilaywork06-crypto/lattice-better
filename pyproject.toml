[project]
name = "lattice"
version = "2.0.0"
description = "Lattice — hierarchical hardware asset tracking (setups / assemblies / cards)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
lattice-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E", "W", "I"]
"scripts/*.py" = ["E501"]  # data tables read best one row per line

[tool.ruff.lint.isort]
known-first-party = ["lattice_core", "lattice_notifications", "lattice_shared"]
known-local-folder = ["conftest"]
