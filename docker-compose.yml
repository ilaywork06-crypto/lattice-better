# Lattice — the whole stack.   docker compose up --build   →   http://localhost:8080
#
#   web (nginx)            :8080  the app; proxies /api to the two services
#   core-api               :8000  OpenAPI docs at /docs
#   notification-service   :8001  OpenAPI docs at /docs
#   mailhog                :8025  the emails Lattice sends
name: lattice

x-secrets: &jwt
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-to-a-long-random-string}
  JWT_ALGORITHM: HS256

services:
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lattice_dev_pw}
      POSTGRES_DB: lattice_core
    volumes: [pg_core:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice -d lattice_core"]
      interval: 5s
      retries: 10

  postgres-notify:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lattice_dev_pw}
      POSTGRES_DB: lattice_notify
    volumes: [pg_notify:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice -d lattice_notify"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["8025:8025"]

  core-api:
    build: { context: ., dockerfile: services/core-api/Dockerfile }
    environment:
      <<: *jwt
      DATABASE_URL: postgresql+psycopg://lattice:${POSTGRES_PASSWORD:-lattice_dev_pw}@postgres-core:5432/lattice_core
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@lattice.io}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin1234}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on:
      postgres-core: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *jwt
      NOTIFY_DATABASE_URL: postgresql+psycopg://lattice:${POSTGRES_PASSWORD:-lattice_dev_pw}@postgres-notify:5432/lattice_notify
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-lattice@lattice.io}
    ports: ["8001:8001"]
    depends_on:
      postgres-notify: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailhog: { condition: service_started }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [core-api, notification-service]

volumes:
  pg_core:
  pg_notify:
  uploads:
